<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
    integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D"
    crossorigin="anonymous"></script>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">

  <title>HBJ</title>

  <script type="text/javascript" src="letras.js"></script>
  <link rel="stylesheet" href="https://dhbhdrzi4tiry.cloudfront.net/cdn/sites/foundation.min.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar"
        aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <img class="navbar-brand" src="./hbj_transparent.png" width="150" class="d-inline-block align-top" alt="HBJ">

      <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
        aria-labelledby="offcanvasDarkNavbarLabel">

        <div class="offcanvas-header">
          <img class="offcanvas-title" src="./hbj_transparent.png" width="150" id="offcanvasDarkNavbarLabel"
            class="d-inline-block align-top" alt="HBJ">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">

          <div id="buttonArea" style="margin: 0px"></div>

        </div>
      </div>
    </div>
  </nav>

  <div class="off-canvas-wrapper">
    <div class="off-canvas-wrapper-inner" data-off-canvas-wrapper>
      <div class="callout" style="min-height: 60vh">
        <div class="">
          <h3><span id="number"></span> - <span id="title"></span></h3>
          <pre id="demo"></pre>
          <div class="d-flex align-items-center gap-2 ms-auto" style="bottom: 30px; right: 30px; position: fixed;">
            <button onclick="mudarFonte(-1)" class="btn btn-sm"
              style="background:#1e568d; color:#fff; font-weight:bold; font-size:1.2rem; width:36px; height:36px;">A-</button>
            <button onclick="mudarFonte(1)" class="btn btn-sm"
              style="background:#1e568d; color:#fff; font-weight:bold; font-size:1.2rem; width:36px; height:36px;">A+</button>
          </div>

        </div>
      </div>
    </div>

    <div class="row">
      <div class="medium-6 columns">
        <h4>Fale Conosco</h4>
      </div>
      <form id="meu-form" class="medium-6 columns" action="https://formspree.io/f/xnndgajn" method="POST">
        <label>Nome*
          <input type="text" name="nome" placeholder="Seu nome" required>
        </label>
        <label>E-mail*
          <input type="email" name="email" placeholder="Seu e-mail" required>
        </label>
        <label>
          Mensagem*
          <textarea name="message" placeholder="Sua mensagem" required></textarea>
        </label>
        <button type="submit" class="button expanded" style="background-color: #103e6b" value="Submit">Enviar</button>
      </form>
      <div id="mensagem-confirmacao" style="display:none; color: green;">
        Obrigado! Sua mensagem foi enviada com sucesso.
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

    <script>
      let number = "";
      let title = "";
      let array = letras;

      let _1a99 = renderBtns(0);
      let _100a199 = renderBtns(1);
      let _200a299 = renderBtns(2);
      let _300a399 = renderBtns(3);
      let _400a499 = renderBtns(4);
      let _500a599 = renderBtns(5);

      let btns = _1a99 + _100a199 + _200a299 + _300a399 + _400a499 + _500a599;

      document.getElementById("buttonArea").innerHTML = btns;

      function renderBtns(page) {
        const start = page * 100;
        const items = array.slice(start, start + 100);
        let btnsHtml = '';

        items.forEach((e, i) => {
          const index = start + i; // índice original
          btnsHtml += `<button type="button" data-bs-dismiss="offcanvas" 
            class="btn btn-info" 
            style="background-color: #103e6b; text-wrap: auto; display: grid; grid-template-columns: 20% 80%; align-items: center; text-align: start; width: 100%;" 
            onclick=" setElement(${e.id})">
              <span>${e.id}.</span>
              <span>${e.nome}</span>
          </button>`;
        });

        return `<div class="accordion" id="accordion_${page}">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#collapse_${page}" 
                aria-controls="collapse_${page}">
                ${start} a ${start + 99}
              </button>
            </h2>
            <div id="collapse_${page}" class="accordion-collapse collapse" data-bs-parent="#accordion_${page}">
              <div class="accordion-body">
                ${btnsHtml}
              </div>
            </div>
          </div>
        </div>`;
      }

      function setElement(id) {
        const element = array.find(e => e.id === id);
        document.getElementById('number').innerHTML = element.id;
        document.getElementById('title').innerHTML = element.nome;

        const letraFormatada = element.letra.replace(/\*\*\*([\s\S]*?)\*\*\*/g, '<em>$1</em>');
        document.getElementById('demo').innerHTML = letraFormatada;
      }

      function showList() {
        var element = document.getElementById("buttonArea");
        element.classList.disable("disable");
      }
    </script>

    <script>
      const form = document.getElementById('meu-form');
      const msg = document.getElementById('mensagem-confirmacao');

      form.addEventListener('submit', async function (event) {
        event.preventDefault(); // impede o redirecionamento

        const data = new FormData(form);
        const action = form.action;
        const response = await fetch(action, {
          method: 'POST',
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          form.style.display = 'none'; // esconde o formulário
          msg.style.display = 'block'; // mostra a mensagem
        } else {
          alert('Erro ao enviar. Tente novamente mais tarde.');
        }
      });
    </script>

    <script>
      const MIN_FONT = 12;
      const MAX_FONT = 28;
      let fonteAtual = parseInt(localStorage.getItem('fonteHBJ')) || 16;

      aplicarFonte(fonteAtual);

      function mudarFonte(delta) {
        fonteAtual = Math.min(MAX_FONT, Math.max(MIN_FONT, fonteAtual + delta));
        aplicarFonte(fonteAtual);
        localStorage.setItem('fonteHBJ', fonteAtual);
      }

      function aplicarFonte(tamanho) {
        document.getElementById('demo').style.fontSize = tamanho + 'px';
        document.getElementById('demo').style.lineHeight = (tamanho * 1.6) + 'px';
      }
    </script>

    <style>
      body {
        background-color: rgb(52, 58, 64);
      }

      body,
      label {
        color: #fff !important;
      }

      .container-fluid {
        margin: 0px !important;
        padding: 0px !important;
      }

      .navbar {
        padding: .5rem 0 !important;
      }

      .accordion {
        background: transparent !important;
        border: none !important;
        --bs-accordion-active-bg: #92b3e6;
        --bs-accordion-color: #ffffff;
        --bs-accordion-bg: #0f4070;
        padding-bottom: 10px;
      }

      .accordion-button::after {
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round'%3e%3cpath d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
      }

      .accordion-item {
        /* color: var(--bs-accordion-color); */
        background-color: transparent !important;
        border: none !important;
      }

      .accordion-button {
        color: #ffffff !important;
      }

      .accordion-body {
        padding: 0 !important;
        border: none;
      }

      .btn-info {
        border-color: #1e568d;
      }

      .accordion-button:not(.collapsed) {
        box-shadow: none;
      }

      .callout {
        margin-bottom: 20px;
        padding-left: 20px;
        color: #0f4070;
      }

      pre {
        font-family: unset;
        text-wrap: auto
      }

      pre em {
        font-style: italic;
        font-weight: 600;
      }
    </style>
</body>

</html>
